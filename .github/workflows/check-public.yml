name: Check public release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate public fields and release structure
        run: python tools/verify_public_release.py --package . --allow-git-worktree
      - name: Stage website without deploying
        run: python tools/build_site.py --output "$RUNNER_TEMP/site-check"
